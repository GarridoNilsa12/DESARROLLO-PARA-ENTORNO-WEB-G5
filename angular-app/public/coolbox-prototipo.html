<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolbox — Prototipo Funcional</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --red:#ed1c24;
  --red-dark:#c8151b;
  --black:#1c1c1c;
  --gray:#f4f4f4;
  --gray-2:#f9f9f9;
  --border:#e2e2e2;
  --green:#1ea84b;
  --blue:#087c9e;
  --text-muted:#777;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{
  background:#dcdcdc;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

/* ===== FRAME ===== */
#frame{
  width:390px;
  height:780px;
  background:#fff;
  border-radius:34px;
  border:8px solid #111;
  overflow:hidden;
  position:relative;
  box-shadow:0 20px 45px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}
#notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:130px;height:22px;background:#111;border-radius:0 0 16px 16px;z-index:50;
}

/* ===== TOP BAR ===== */
.topbar{
  height:52px;flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  padding:0 14px;border-bottom:1px solid var(--border);
  background:#fff;position:relative;z-index:10;
}
.icon-btn{
  font-size:18px;color:#333;cursor:pointer;width:26px;text-align:center;
  background:none;border:none;
}
.logo{
  font-weight:800;letter-spacing:.5px;font-size:16px;flex:1;text-align:center;color:var(--black);
}
.logo span{color:var(--red);}
.cart-wrap{position:relative;cursor:pointer;}
.cart-badge{
  position:absolute;top:-7px;right:-9px;background:var(--red);color:#fff;
  font-size:9px;font-weight:bold;border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;
}

/* ===== LOCATION ===== */
.locbar{
  font-size:11px;color:#555;padding:8px 14px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;flex:0 0 auto;background:#fff;
}

/* ===== SCROLL AREA ===== */
#view{
  flex:1;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch;
}
#view::-webkit-scrollbar{width:0px;}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:#fff;
}
.bottomnav .tab{
  flex:1;text-align:center;padding:8px 0 10px;font-size:9.5px;color:#999;cursor:pointer;
}
.bottomnav .tab i{display:block;font-size:16px;margin-bottom:3px;}
.bottomnav .tab.active{color:var(--red);}

/* ===== GENERIC ===== */
.px{padding:12px 14px;}
.section-title{font-size:15px;font-weight:800;margin:14px 14px 8px;}
.muted{color:var(--text-muted);font-size:11px;}
.backlink{
  font-size:11.5px;color:var(--blue);padding:10px 14px 0;cursor:pointer;display:block;
}
.chip-row{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;}
.chip{
  background:var(--gray);border-radius:14px;padding:6px 12px;font-size:10.5px;white-space:nowrap;color:#444;
}

/* ===== HOME ===== */
.banner{
  margin:10px 14px;height:120px;border-radius:var(--radius);
  background:linear-gradient(135deg,#1c1c1c,#3a3a3a);color:#fff;
  display:flex;flex-direction:column;justify-content:center;padding:16px;
}
.banner b{font-size:15px;}
.banner small{opacity:.8;font-size:10.5px;margin-top:4px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px;}
.card{
  border:1px solid var(--border);border-radius:var(--radius);padding:10px;position:relative;
  cursor:pointer;transition:.15s;background:#fff;
}
.card:active{transform:scale(.97);}
.card .img{
  height:80px;background:var(--gray);border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:8px;
}
.card .name{font-size:11.5px;font-weight:700;line-height:1.3;min-height:28px;}
.card .price{font-size:14px;font-weight:800;margin-top:6px;}
.card .old{font-size:9.5px;color:#999;text-decoration:line-through;margin-left:4px;}
.heart{
  position:absolute;top:8px;right:8px;font-size:13px;color:#ccc;background:#fff;
  border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2;
}
.heart.active{color:var(--red);}
.flash{
  margin:14px;padding:10px 14px;border-radius:var(--radius);background:#fff3f3;color:var(--red);
  font-weight:700;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;
}

/* ===== MENU DRAWER ===== */
#overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:40;
}
#overlay.show{opacity:1;pointer-events:auto;}
#drawer{
  position:absolute;top:0;left:0;bottom:0;width:82%;background:#fff;z-index:41;
  transform:translateX(-105%);transition:transform .28s;display:flex;flex-direction:column;
}
#drawer.show{transform:translateX(0);}
.drawer-header{
  display:flex;align-items:center;padding:20px 16px;border-bottom:1px solid var(--border);gap:10px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.drawer-header .who{flex:1;}
.drawer-header .who b{font-size:14px;display:block;}
.drawer-header .who small{color:var(--text-muted);}
.drawer-close{font-size:20px;color:#888;cursor:pointer;}
.dmenu{padding:6px 0;overflow-y:auto;}
.ditem{
  display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:13.5px;color:#333;cursor:pointer;
}
.ditem:active{background:var(--gray-2);}
.ditem i:first-child{width:20px;color:#555;}
.ditem .arr{margin-left:auto;color:#bbb;font-size:11px;}
.ditem.hot{color:var(--red);font-weight:700;}
.ditem.hot i:first-child{color:var(--red);}
hr.dsep{border:none;border-top:1px solid #eee;margin:6px 14px;}
.login-cta{
  margin:14px;padding:12px;text-align:center;border:1.5px solid var(--red);border-radius:10px;
  color:var(--red);font-weight:700;font-size:12.5px;cursor:pointer;
}

/* ===== PRODUCT DETAIL ===== */
.pd-img{
  height:220px;margin:10px 14px;background:var(--gray);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;
}
.pd-stars{color:#f4b400;padding:10px 14px 0;font-size:14px;}
.pd-title{padding:6px 14px;font-size:14px;line-height:1.4;}
.pd-brand{color:var(--blue);font-weight:700;}
.pd-price-row{padding:10px 14px;display:flex;align-items:center;gap:10px;}
.pd-price{font-size:24px;font-weight:800;}
.pd-old{font-size:11px;color:#999;text-decoration:line-through;}
.discount-tag{background:var(--green);color:#fff;font-size:10px;padding:3px 7px;border-radius:5px;font-weight:700;}
.qty-stock{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.qty{display:flex;border:1px solid #ccc;border-radius:6px;overflow:hidden;}
.qty button{width:32px;height:32px;border:none;background:#fff;font-size:15px;cursor:pointer;}
.qty span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;border-left:1px solid #eee;border-right:1px solid #eee;}
.stock-txt{color:var(--green);font-weight:700;font-size:11.5px;}
.btn{
  width:100%;padding:13px;border-radius:9px;font-weight:700;font-size:13px;border:none;cursor:pointer;
  margin:6px 0;transition:.15s;
}
.btn:active{transform:scale(.98);}
.btn-red{background:var(--red);color:#fff;}
.btn-black{background:#222;color:#fff;}
.btn-outline{background:#fff;border:1px solid #ccc;color:#333;}
.btn-blue-soft{background:#e2f8ff;border:1px solid #20b9df;color:var(--blue);}
.btn-green-soft{background:#e7f7e9;border:1px solid #66c47b;color:#277d3d;}
.btn-row-wrap{padding:4px 14px 8px;}
.pay-methods{padding:12px 14px;font-size:11.5px;color:#555;}
.seller-box{
  margin:8px 14px 16px;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;
}
.seller-box .rate{float:right;background:var(--green);color:#fff;padding:4px 8px;border-radius:5px;font-weight:700;}

/* ===== REVIEWS ===== */
.rev-score{font-size:34px;font-weight:800;padding:0 14px;}
.rev-box{margin:10px 14px;padding:13px;border-radius:10px;background:var(--gray-2);border:1px solid var(--border);}
.rev-user{font-weight:700;font-size:12.5px;}
.rev-date{float:right;color:#999;font-size:10.5px;}
.rev-text{margin-top:8px;font-size:11.5px;color:#444;line-height:1.5;}
.load-more{
  margin:16px auto;width:60%;padding:10px;border-radius:18px;border:1px solid var(--border);
  text-align:center;font-size:12px;color:#333;cursor:pointer;
}

/* ===== SIMPLE SPECS ===== */
.info-card{margin:10px 14px;border:1px solid #cceffb;border-radius:10px;padding:12px;background:#f6fdff;}
.info-card h4{font-size:13px;margin-bottom:5px;}
.info-card p{font-size:11.5px;color:#555;line-height:1.4;}

/* ===== STORES ===== */
.map-box{
  margin:10px 14px;height:110px;border-radius:10px;background:#e6f5ea;color:#3f9e5b;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
}
.store-card{margin:10px 14px;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11.5px;}
.store-card h4{font-size:11.5px;margin-bottom:4px;}
.avail{color:var(--green);font-weight:700;}
.sold-out{color:#e53935;font-weight:700;}
.store-btn{float:right;padding:6px 9px;border:1px solid #888;border-radius:6px;background:#fff;font-size:9.5px;cursor:pointer;}

/* ===== COMPARE ===== */
.compare-table{width:calc(100% - 28px);margin:12px 14px;border-collapse:collapse;font-size:11px;}
.compare-table td{border:1px solid var(--border);padding:9px 6px;text-align:center;}
.compare-table td:first-child{text-align:left;font-weight:600;color:#555;}
.win{background:#d7ffe0;font-weight:700;}
.compare-pick{
  margin:16px 14px;padding:12px;text-align:center;border-radius:20px;background:#ffd900;
  font-weight:700;font-size:12.5px;cursor:pointer;
}
.compare-slot{
  display:flex;align-items:center;gap:8px;margin:8px 14px;padding:9px;border:1px dashed #ccc;
  border-radius:8px;font-size:11px;
}
.compare-slot .rm{margin-left:auto;color:#c33;cursor:pointer;}

/* ===== CART / WISHLIST rows ===== */
.line-item{
  display:flex;gap:10px;margin:0 14px 12px;border:1px solid var(--border);border-radius:10px;padding:9px;
}
.line-img{width:52px;height:52px;border-radius:8px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-size:24px;}
.line-info{flex:1;font-size:10.5px;}
.line-info b{font-size:11px;display:block;}
.line-price{font-weight:800;font-size:13px;margin-top:4px;}
.line-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.mini-qty{display:flex;border:1px solid #ddd;border-radius:5px;}
.mini-qty button{width:20px;height:20px;border:none;background:#fff;font-size:11px;}
.mini-qty span{width:20px;text-align:center;font-size:10px;line-height:20px;}
.trash{color:#999;cursor:pointer;font-size:12px;}
.addon{
  display:flex;gap:8px;margin:0 14px 8px;border:1px solid #b8e9f3;border-radius:9px;padding:8px;align-items:center;
}
.addon .im{width:38px;height:38px;background:var(--gray);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.addon .ai{flex:1;font-size:10.5px;}
.addon .combo{color:var(--green);font-size:8.5px;font-weight:700;display:block;}
.addon .price{color:var(--red);font-weight:800;font-size:11px;}
.addon button{background:#222;color:#fff;border:none;border-radius:5px;padding:6px 8px;font-size:9px;font-weight:700;}
.summary{border-top:1px solid var(--border);margin:14px;padding-top:12px;font-size:12px;}
.sum-row{display:flex;justify-content:space-between;margin-bottom:7px;}
.sum-total{font-size:15px;font-weight:800;display:flex;justify-content:space-between;margin-top:10px;}
.sum-total b{color:var(--red);}
.empty-state{text-align:center;padding:60px 24px;color:#888;}
.empty-state i{font-size:44px;color:#ddd;margin-bottom:14px;display:block;}

/* ===== PURCHASES / RETURNS ===== */
.order-card{border:1.5px solid var(--red);border-radius:14px;padding:14px;margin:10px 14px;}
.badge{display:inline-block;background:#ffe5e5;color:var(--red);padding:5px 10px;border-radius:14px;font-size:10.5px;font-weight:700;margin-bottom:8px;}
.progress{display:flex;align-items:center;margin:16px 0;}
.step{width:14px;height:14px;border-radius:50%;background:#ccc;flex:0 0 auto;}
.step.done{background:var(--green);}
.pline{flex:1;height:3px;background:#ccc;}
.pline.done{background:var(--green);}
.radio-opt{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:12px;border-bottom:1px solid #f0f0f0;}
.success-wrap{text-align:center;padding:36px 20px;}
.success-wrap i{font-size:56px;color:var(--green);margin-bottom:14px;}
.tl-item{display:flex;gap:10px;margin:12px 14px;font-size:11.5px;text-align:left;}
.tl-dot{width:10px;height:10px;background:var(--green);border-radius:50%;margin-top:4px;flex:0 0 auto;}

/* ===== TOAST ===== */
#toast{
  position:absolute;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:10px 18px;border-radius:22px;font-size:12px;
  opacity:0;transition:.25s;z-index:60;white-space:nowrap;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Search results row */
.search-empty{padding:40px 20px;text-align:center;color:#999;font-size:12.5px;}
</style>
</head>

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');

  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function updateBadge(){
  const n = cartQty();
  const b = $('#cartBadge');
  b.textContent = n;
  b.style.display = n>0 ? 'flex' : 'none';
}

function setActiveTab(name){
  document.querySelectorAll('.bottomnav .tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===name);
  });
}


function go(view, payload){
  state.view = view;
  if(payload) Object.assign(state, payload);
  closeDrawer();
  $('#view').scrollTop = 0;
  render();
}

function render(){
  updateBadge();
  const tabMap = {home:'home', wishlist:'wishlist', compare:'compare', purchases:'purchases', cart:'cart'};
  setActiveTab(tabMap[state.view] || '');
  const v = $('#view');
  switch(state.view){
    case 'home': v.innerHTML = viewHome(); break;
    case 'search': v.innerHTML = viewSearch(); break;
    case 'product': v.innerHTML = viewProduct(); break;
    case 'specs': v.innerHTML = viewSpecs(); break;
    case 'reviews': v.innerHTML = viewReviews(); break;
    case 'stores': v.innerHTML = viewStores(); break;
    case 'compare': v.innerHTML = viewCompare(); break;
    case 'cart': v.innerHTML = viewCart(); break;
    case 'wishlist': v.innerHTML = viewWishlist(); break;
    case 'purchases': v.innerHTML = viewPurchases(); break;
    case 'return': v.innerHTML = viewReturn(); break;
    case 'returnSuccess': v.innerHTML = viewReturnSuccess(); break;
    case 'chat': v.innerHTML = viewChat(); scrollChatToBottom(); break;
    default: v.innerHTML = viewHome();
  }
}

  return `
  <div class="px" style="padding-bottom:0;">
    <div style="font-weight:800;font-size:17px;">Mi Lista de Deseos 💗</div>
    <div class="muted">${state.wishlist.length} artículo${state.wishlist.length!==1?'s':''} guardado${state.wishlist.length!==1?'s':''}</div>
  </div>
  <div style="margin-top:10px;">${items}</div>
  `;
}

function viewPurchases(){
  const rows = ORDERS.map(o=>{
    const p = findProduct(o.product);
    return `
    <div class="order-card">
      <div class="badge">${o.status}</div>
      <h3 style="font-size:14px;">${o.label}</h3>
      <div class="muted">Pedido #${o.id}</div>
      <div class="progress">
        ${Array.from({length:o.steps}).map((_,i)=>`${i>0?'<div class="pline done"></div>':''}<div class="step done"></div>`).join('')}
      </div>
      <div class="line-item" style="margin:0 0 10px;">
        <div class="line-img">${p.icon}</div>
        <div class="line-info"><b>${p.name.split(',')[0]}</b><div class="muted">${o.color}</div></div>
      </div>
      <button class="btn btn-red" onclick="go('return',{returnStep:{orderId:'${o.id}', reason:null}})">Devolver producto</button>
    </div>`;
  }).join('');
  return `
  <div class="px" style="padding-bottom:0;"><div style="font-weight:800;font-size:17px;">Mis Compras 📦</div></div>
  ${rows}
  `;
}

const RETURN_REASONS = ['Llegó dañado o defectuoso','No era lo que esperaba','Cambié de opinión','Producto incorrecto','Otro motivo'];
function viewReturn(){
  const order = ORDERS.find(o=>o.id===state.returnStep.orderId);
  const p = findProduct(order.product);
  return `
  <span class="backlink" onclick="go('purchases')">← Volver a mis compras</span>
  <div class="px"><div style="font-weight:800;font-size:17px;">Solicitar devolución</div><div class="muted">Pedido #${order.id}</div></div>
  <div class="line-item">
    <div class="line-img">${p.icon}</div>
    <div class="line-info"><b>${p.name.split(',')[0]}</b><div class="muted">${order.color}</div></div>
  </div>
  <div class="px">
    <div style="font-weight:700;font-size:12.5px;margin-top:6px;">¿Cuál es el motivo?</div>
    ${RETURN_REASONS.map(r=>`
      <div class="radio-opt">
        <input type="radio" name="reason" id="r_${r}" onclick="state.returnStep.reason='${r}'">
        <label for="r_${r}">${r}</label>
      </div>`).join('')}
  </div>
  <div class="btn-row-wrap">
    <button class="btn btn-red" onclick="confirmReturn()">Confirmar devolución</button>
  </div>
  `;
}
function confirmReturn(){
  const sel = document.querySelector('input[name="reason"]:checked');
  if(!sel){ toast('Selecciona un motivo para continuar'); return; }
  go('returnSuccess');
}
function viewReturnSuccess(){
  const order = ORDERS.find(o=>o.id===state.returnStep.orderId);
  return `
  <div class="success-wrap">
    <i class="fa-solid fa-circle-check"></i>
    <h3>¡Solicitud enviada!</h3>
    <p class="muted">Tu devolución del pedido #${order.id} fue registrada correctamente.</p>
  </div>
  <div class="tl-item"><div class="tl-dot"></div><span>Solicitud recibida — hoy</span></div>
  <div class="tl-item"><div class="tl-dot" style="background:#ccc;"></div><span style="color:#999;">Recojo programado — en 24 a 48h</span></div>
  <div class="tl-item"><div class="tl-dot" style="background:#ccc;"></div><span style="color:#999;">Reembolso procesado — al confirmar inspección</span></div>
  <div class="btn-row-wrap"><button class="btn btn-black" onclick="go('purchases')">Volver a mis compras</button></div>
  `;
}


render();
</script>
</body>
</html>
