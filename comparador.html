<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolbox — Comparador de productos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --red:#ed1c24; --red-dark:#c8151b; --black:#1c1c1c;
  --gray:#f4f4f4; --gray-2:#f9f9f9; --border:#e2e2e2;
  --text-muted:#777; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:var(--gray-2);color:var(--black);}

/* NAVBAR */
.navbar{
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 40px;position:sticky;top:0;z-index:20;
}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;}
.logo span{color:var(--red);}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--black);text-decoration:none;font-size:14px;font-weight:600;}
.nav-links a.active{color:var(--red);}
.nav-links a:hover{color:var(--red);}

/* HERO */
.hero{padding:36px 40px 8px;max-width:1100px;margin:0 auto;}
.hero h1{font-size:26px;margin-bottom:6px;}
.hero p{color:var(--text-muted);font-size:14px;}

/* PICKER */
.picker{
  max-width:1100px;margin:20px auto 0;padding:0 40px;
  display:flex;gap:12px;flex-wrap:wrap;
}
.pick-item{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;
  font-size:13px;transition:border-color .15s;
}
.pick-item img{width:34px;height:34px;object-fit:contain;}
.pick-item.selected{border-color:var(--red);background:#fff5f5;}
.pick-item .price{color:var(--red);font-weight:700;font-size:12px;}

/* COMPARE TABLE */
.compare-wrap{max-width:1100px;margin:28px auto 60px;padding:0 40px;overflow-x:auto;}
table.compare{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
table.compare th, table.compare td{padding:14px 18px;border-bottom:1px solid var(--border);text-align:left;font-size:13.5px;}
table.compare th.prod-col{min-width:220px;vertical-align:top;background:var(--gray);}
table.compare th.label-col{background:var(--gray);color:var(--text-muted);font-weight:700;width:160px;}
.prod-col img{width:90px;height:90px;object-fit:contain;display:block;margin-bottom:8px;}
.prod-col .name{font-weight:800;font-size:14px;margin-bottom:4px;}
.prod-col .price{color:var(--red);font-weight:800;font-size:15px;}
.remove-btn{
  background:none;border:none;color:var(--text-muted);cursor:pointer;
  font-size:12px;margin-top:8px;
}
.remove-btn:hover{color:var(--red);}
.empty-slot{
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  color:var(--text-muted);font-size:13px;padding:30px 10px;
}
.empty-slot i{font-size:22px;margin-bottom:8px;}
.cta{
  background:var(--red);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius);
  font-weight:700;font-size:13px;cursor:pointer;margin-top:6px;
}
.cta:hover{background:var(--red-dark);}
.notice{max-width:1100px;margin:0 auto;padding:0 40px;color:var(--text-muted);font-size:12.5px;}
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">COOL<span>BOX</span></div>
  <ul class="nav-links">
    <li><a href="#">Inicio</a></li>
    <li><a href="#" class="active">Comparador</a></li>
    <li><a href="chat.html">Chat en vivo</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="lista-deseos.html">Lista de deseos</a></li>
  </ul>
</div>

<div class="hero">
  <h1>Comparador de productos</h1>
  <p>Selecciona hasta 3 productos de la misma categoría para comparar sus características.</p>
</div>

<div class="picker" id="picker"></div>
<p class="notice" id="limitNotice" style="display:none;">Ya seleccionaste el máximo de 3 productos. Quita uno para agregar otro.</p>

<div class="compare-wrap">
  <table class="compare" id="compareTable"></table>
</div>

<script>
const PRODUCTS = [
  {id:'p1', name:'Laptop ProBook X14', price:'S/ 3,299', img:'https://cdn-icons-png.flaticon.com/128/2991/2991108.png',
   specs:{'Procesador':'Intel Core i5-1235U','RAM':'8 GB','Almacenamiento':'512 GB SSD','Pantalla':'14" Full HD','Batería':'Hasta 10 h','Peso':'1.4 kg'}},
  {id:'p2', name:'Laptop UltraSlim R5', price:'S/ 2,799', img:'https://cdn-icons-png.flaticon.com/128/2991/2991108.png',
   specs:{'Procesador':'AMD Ryzen 5 5500U','RAM':'8 GB','Almacenamiento':'256 GB SSD','Pantalla':'15.6" Full HD','Batería':'Hasta 8 h','Peso':'1.6 kg'}},
  {id:'p3', name:'Laptop GamerX 16', price:'S/ 4,590', img:'https://cdn-icons-png.flaticon.com/128/2991/2991108.png',
   specs:{'Procesador':'Intel Core i7-13700H','RAM':'16 GB','Almacenamiento':'1 TB SSD','Pantalla':'16" QHD 165Hz','Batería':'Hasta 6 h','Peso':'2.3 kg'}},
  {id:'p4', name:'Smartphone Nova 12', price:'S/ 1,199', img:'https://cdn-icons-png.flaticon.com/128/545/545245.png',
   specs:{'Procesador':'Snapdragon 695','RAM':'8 GB','Almacenamiento':'128 GB','Pantalla':'6.5" AMOLED','Batería':'5000 mAh','Cámara':'50 MP'}},
  {id:'p5', name:'Smartphone Nova 12 Pro', price:'S/ 1,799', img:'https://cdn-icons-png.flaticon.com/128/545/545245.png',
   specs:{'Procesador':'Snapdragon 8 Gen 2','RAM':'12 GB','Almacenamiento':'256 GB','Pantalla':'6.7" AMOLED 120Hz','Batería':'5000 mAh','Cámara':'108 MP'}},
];

let selected = [];

function renderPicker(){
  const el = document.getElementById('picker');
  el.innerHTML = PRODUCTS.map(p => `
    <div class="pick-item ${selected.includes(p.id)?'selected':''}" onclick="toggleSelect('${p.id}')">
      <img src="${p.img}" alt="">
      <div>
        <div>${p.name}</div>
        <div class="price">${p.price}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('limitNotice').style.display = selected.length>=3 ? 'block':'none';
}

function toggleSelect(id){
  if(selected.includes(id)){
    selected = selected.filter(s=>s!==id);
  } else {
    if(selected.length>=3) return;
    selected.push(id);
  }
  renderPicker();
  renderTable();
}

function removeFromCompare(id){
  selected = selected.filter(s=>s!==id);
  renderPicker();
  renderTable();
}

function renderTable(){
  const table = document.getElementById('compareTable');
  const chosen = selected.map(id => PRODUCTS.find(p=>p.id===id));

  if(chosen.length===0){
    table.innerHTML = `<tr><td style="padding:40px;text-align:center;color:#777;">
      Elige productos arriba para comenzar a comparar.</td></tr>`;
    return;
  }

  // union of spec labels, preserving order of first product
  const labels = [];
  chosen.forEach(p => Object.keys(p.specs).forEach(k => { if(!labels.includes(k)) labels.push(k); }));

  let head = '<tr><th class="label-col">Producto</th>';
  chosen.forEach(p => {
    head += `<th class="prod-col">
      <img src="${p.img}" alt="">
      <div class="name">${p.name}</div>
      <div class="price">${p.price}</div>
      <button class="remove-btn" onclick="removeFromCompare('${p.id}')"><i class="fa-solid fa-xmark"></i> Quitar</button>
    </th>`;
  });
  // extra empty slots up to 3
  for(let i=chosen.length;i<3;i++){
    head += `<th class="prod-col"><div class="empty-slot"><i class="fa-solid fa-plus"></i>Agregar producto</div></th>`;
  }
  head += '</tr>';

  let rows = '';
  labels.forEach(label => {
    rows += `<tr><td style="font-weight:700;color:#555;">${label}</td>`;
    chosen.forEach(p => { rows += `<td>${p.specs[label] || '—'}</td>`; });
    for(let i=chosen.length;i<3;i++){ rows += `<td>—</td>`; }
    rows += '</tr>';
  });

  table.innerHTML = head + rows;
}

renderPicker();
renderTable();
</script>
</body>
</html>
