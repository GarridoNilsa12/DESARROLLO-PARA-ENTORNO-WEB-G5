<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolbox — Reseñas y calificaciones</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --red:#ed1c24; --red-dark:#c8151b; --black:#1c1c1c;
  --gray:#f4f4f4; --gray-2:#f9f9f9; --border:#e2e2e2;
  --gold:#f5a623; --text-muted:#777; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:var(--gray-2);color:var(--black);}

.navbar{
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 40px;position:sticky;top:0;z-index:20;
}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;}
.logo span{color:var(--red);}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--black);text-decoration:none;font-size:14px;font-weight:600;}
.nav-links a.active{color:var(--red);}
.nav-links a:hover{color:var(--red);}

.wrap{max-width:960px;margin:0 auto;padding:32px 40px 60px;}

.product-head{display:flex;gap:24px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:28px;}
.product-head img{width:120px;height:120px;object-fit:contain;}
.product-head h1{font-size:20px;margin-bottom:6px;}
.product-head .price{color:var(--red);font-weight:800;font-size:18px;margin-bottom:8px;}
.rating-summary{display:flex;align-items:center;gap:10px;}
.stars{color:var(--gold);font-size:16px;}
.rating-summary .num{font-weight:800;font-size:16px;}
.rating-summary .count{color:var(--text-muted);font-size:12.5px;}

.bars{margin-top:14px;display:flex;flex-direction:column;gap:5px;max-width:260px;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);}
.bar-track{flex:1;height:7px;background:var(--gray);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--gold);}

.section-title{font-size:16px;font-weight:800;margin:10px 0 14px;}

.review-form{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:26px;}
.star-input{font-size:22px;color:var(--border);cursor:pointer;margin-bottom:12px;}
.star-input i.active{color:var(--gold);}
.review-form textarea, .review-form input[type=text]{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:13px;margin-bottom:10px;font-family:inherit;
}
.review-form textarea{resize:vertical;min-height:70px;}
.submit-btn{background:var(--red);color:#fff;border:none;padding:10px 22px;border-radius:var(--radius);font-weight:700;font-size:13px;cursor:pointer;}
.submit-btn:hover{background:var(--red-dark);}

.review{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.reviewer{font-weight:700;font-size:13.5px;}
.review-date{font-size:11.5px;color:var(--text-muted);}
.review-stars{color:var(--gold);font-size:13px;margin-bottom:6px;}
.review-text{font-size:13.5px;line-height:1.5;color:#333;}
.badge-verified{background:#e6f7ea;color:#1ea84b;font-size:10.5px;padding:2px 8px;border-radius:8px;margin-left:8px;font-weight:700;}
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">COOL<span>BOX</span></div>
  <ul class="nav-links">
    <li><a href="#">Inicio</a></li>
    <li><a href="comparador.html">Comparador</a></li>
    <li><a href="chat.html">Chat en vivo</a></li>
    <li><a href="#" class="active">Reseñas</a></li>
    <li><a href="lista-deseos.html">Lista de deseos</a></li>
  </ul>
</div>

<div class="wrap">
  <div class="product-head">
    <img src="https://cdn-icons-png.flaticon.com/128/2991/2991108.png" alt="">
    <div>
      <h1>Laptop ProBook X14</h1>
      <div class="price">S/ 3,299</div>
      <div class="rating-summary">
        <span class="stars" id="avgStars"></span>
        <span class="num" id="avgNum"></span>
        <span class="count" id="reviewCount"></span>
      </div>
      <div class="bars" id="bars"></div>
    </div>
  </div>

  <div class="section-title">Escribe tu reseña</div>
  <div class="review-form">
    <div class="star-input" id="starInput">
      <i class="fa-solid fa-star" data-v="1"></i>
      <i class="fa-solid fa-star" data-v="2"></i>
      <i class="fa-solid fa-star" data-v="3"></i>
      <i class="fa-solid fa-star" data-v="4"></i>
      <i class="fa-solid fa-star" data-v="5"></i>
    </div>
    <input type="text" id="reviewerName" placeholder="Tu nombre">
    <textarea id="reviewText" placeholder="Cuéntanos tu experiencia con el producto..."></textarea>
    <button class="submit-btn" onclick="submitReview()">Publicar reseña</button>
  </div>

  <div class="section-title">Opiniones de clientes</div>
  <div id="reviewList"></div>
</div>

<script>
let reviews = [
  {name:'Marco T.', rating:5, date:'hace 3 días', verified:true,
   text:'Excelente relación precio-calidad. La batería rinde todo el día de trabajo remoto.'},
  {name:'Andrea Q.', rating:4, date:'hace 1 semana', verified:true,
   text:'Buen rendimiento para tareas de oficina y diseño básico. El teclado podría ser mejor.'},
  {name:'Renzo P.', rating:3, date:'hace 2 semanas', verified:false,
   text:'Cumple lo básico, pero esperaba más RAM en este rango de precio.'},
];
let selectedStars = 0;

function starsHtml(n){
  let s = '';
  for(let i=1;i<=5;i++){ s += `<i class="fa-solid fa-star" style="${i<=n?'':'opacity:.25'}"></i>`; }
  return s;
}

function renderSummary(){
  const avg = (reviews.reduce((a,r)=>a+r.rating,0)/reviews.length).toFixed(1);
  document.getElementById('avgStars').innerHTML = starsHtml(Math.round(avg));
  document.getElementById('avgNum').textContent = avg;
  document.getElementById('reviewCount').textContent = `(${reviews.length} reseñas)`;

  const counts = [0,0,0,0,0];
  reviews.forEach(r => counts[r.rating-1]++);
  let barsHtml = '';
  for(let star=5; star>=1; star--){
    const c = counts[star-1];
    const pct = reviews.length ? Math.round((c/reviews.length)*100) : 0;
    barsHtml += `<div class="bar-row"><span>${star}★</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span>${c}</span></div>`;
  }
  document.getElementById('bars').innerHTML = barsHtml;
}

function renderReviews(){
  document.getElementById('reviewList').innerHTML = reviews.map(r => `
    <div class="review">
      <div class="review-top">
        <span class="reviewer">${r.name}${r.verified?'<span class="badge-verified">Compra verificada</span>':''}</span>
        <span class="review-date">${r.date}</span>
      </div>
      <div class="review-stars">${starsHtml(r.rating)}</div>
      <div class="review-text">${r.text}</div>
    </div>
  `).join('');
}

document.querySelectorAll('#starInput i').forEach(star => {
  star.addEventListener('click', () => {
    selectedStars = parseInt(star.dataset.v);
    document.querySelectorAll('#starInput i').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.v) <= selectedStars);
    });
  });
});

function submitReview(){
  const name = document.getElementById('reviewerName').value.trim() || 'Anónimo';
  const text = document.getElementById('reviewText').value.trim();
  if(!selectedStars || !text){ alert('Elige una calificación y escribe tu comentario.'); return; }
  reviews.unshift({name, rating:selectedStars, date:'ahora', verified:false, text});
  document.getElementById('reviewerName').value = '';
  document.getElementById('reviewText').value = '';
  selectedStars = 0;
  document.querySelectorAll('#starInput i').forEach(s => s.classList.remove('active'));
  renderSummary();
  renderReviews();
}

renderSummary();
renderReviews();
</script>
</body>
</html>
